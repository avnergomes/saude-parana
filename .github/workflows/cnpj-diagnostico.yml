name: CNPJ diagnóstico de rede (descartável)

# Rodada 1 (run 34795030619) mostrou que, do runner do GitHub, o connect() para
# arquivos.receitafederal.gov.br:443 não completa (timeout de 30 s em todas as
# rotas, inclusive a raiz do host), enquanto de um IP no Brasil responde em
# 0,3 s: o Serpro não atende as faixas do Azure. Rodada 2 testa as saídas:
# o espelho dos mesmos arquivos (Casa dos Dados, Cloudflare) e www.gov.br,
# de onde o consolidar baixa municipios.csv.
#
# Cada probe é um step com if: always(): a conclusão de cada um (success ou
# failure) fica visível na API de jobs sem precisar abrir o log.

on:
  push:
    paths:
      - '.github/workflows/cnpj-diagnostico.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OFICIAL: https://arquivos.receitafederal.gov.br
  TOKEN: YggdBLfdninEJX9
  ESPELHO: https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos
  PASTA_ESPELHO: '2026-08-09'
  PARTE: Estabelecimentos5.zip
  GOVBR: https://www.gov.br/receitafederal/dados/municipios.csv
  FMT: '\nHTTP %{http_code} %{http_version} em %{time_total}s, remoto %{remote_ip}, %{size_download} bytes, %{speed_download} B/s\n'

jobs:
  probes:
    name: Probes a partir do runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Egresso do runner (IP, país, DNS dos hosts)
        if: always()
        run: |
          curl -sS --max-time 20 https://ipinfo.io/json || true
          echo
          getent ahosts arquivos.receitafederal.gov.br || true
          getent ahosts dados-abertos-rf-cnpj.casadosdados.com.br || true
          getent ahosts www.gov.br || true

      - name: Oficial, PROPFIND public.php/webdav (Basic)
        if: always()
        run: >
          curl -sS -f --max-time 25 -X PROPFIND -H 'Depth: 1' -u "$TOKEN:"
          -o /dev/null -w "$FMT" "$OFICIAL/public.php/webdav/"

      - name: gov.br, HEAD municipios.csv (TOM para IBGE)
        if: always()
        run: curl -sS -f -I --max-time 40 -o /dev/null -w "$FMT" "$GOVBR"

      - name: Espelho, GET índice /arquivos/
        if: always()
        run: |
          curl -sS -f --max-time 40 -o indice.html -w "$FMT" "$ESPELHO/"
          grep -o 'href="[0-9-]*/"' indice.html | tail -n 5

      - name: Espelho, GET índice da pasta 2026-08-09
        if: always()
        run: |
          curl -sS -f --max-time 40 -o pasta.html -w "$FMT" "$ESPELHO/$PASTA_ESPELHO/"
          grep -c 'Estabelecimentos[0-9]\.zip' pasta.html

      - name: Espelho, HEAD parte 5 (tamanho e Accept-Ranges)
        if: always()
        run: |
          curl -sS -f -I --max-time 40 "$ESPELHO/$PASTA_ESPELHO/$PARTE" | tr -d '\r' | grep -iE '^(HTTP|content-length|accept-ranges|cf-cache-status|last-modified)'

      - name: Espelho, GET parte 5 com Range 0-0 (espera 206)
        if: always()
        run: |
          codigo="$(curl -sS -f --max-time 40 -r 0-0 -o /dev/null -w '%{http_code}' "$ESPELHO/$PASTA_ESPELHO/$PARTE")"
          echo "HTTP $codigo"
          test "$codigo" = "206"

      - name: Espelho, velocidade nos primeiros 100 MB da parte 0
        if: always()
        run: >
          curl -sS -f --max-time 120 -r 0-104857599 -o /dev/null -w "$FMT"
          "$ESPELHO/$PASTA_ESPELHO/Estabelecimentos0.zip"
