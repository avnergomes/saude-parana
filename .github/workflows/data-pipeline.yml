name: Data Pipeline - Saúde Paraná

on:
  schedule:
    - cron: '0 6 1 * *'  # Dia 1 de cada mês, 6h UTC
  workflow_dispatch:

# contents: commit dos dados. actions: disparar o deploy.yml via API; sem
# "actions: write" o createWorkflowDispatch falha com "Resource not
# accessible by integration" (foi o que quebrou os runs de 08 e 09/2026).
permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    # Mesmo grupo do job que commita no cnpj-pipeline.yml: o cron do dia 1 e o
    # de segunda-feira colidem (ex.: 01/02/2027) e os dois fazem push em main.
    # Sem cancelar: o segundo espera o primeiro terminar.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    # O SIDRA às vezes demora minutos por consulta (30 min estourou em 07/2026)
    # e o InfoDengue (399 chamadas) levou ~24 min no runner em 13/09/2026;
    # a primeira rodada completa fechou em 32 min.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Ponta atual do branch, não o SHA do disparo: se este job esperou o
        # grupo data-commit, o outro pipeline pode ter feito push nesse meio-tempo.
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        # pyyaml: os testes de regressão dos workflows leem os .yml
        run: pip install -r scripts/requirements.txt pytest pyyaml

      - name: Run tests
        run: python -m pytest tests -q

      - name: Download data
        id: download
        # Uma falha do SIDRA não pode impedir os ETLs de domínio nem o commit do
        # que mudou; o job falha no último step para o alerta não se perder.
        continue-on-error: true
        run: python scripts/download_data.py

      - name: Run domain ETLs (CNES, SIM, SIH, SIOPS, APS, InfoDengue, ANS)
        id: etl
        # Cada fonte é isolada: se cair e já existir saída anterior, ela é
        # mantida com aviso (::warning:: no stdout); código 1 = domínio sem
        # saída, que também só derruba o job no fim, depois do commit.
        continue-on-error: true
        run: python scripts/run_etl.py

      - name: Preprocess data
        # Depois dos ETLs: a "atualizacao" do metadata.json é o maior
        # alterado_em do manifesto, que os ETLs acabaram de atualizar.
        # Nenhum ETL lê mortalidade.json nem metadata.json.
        # Só com o download completo: com o SIDRA parcial (uma consulta nova,
        # outra antiga) o mortalidade.json sairia misturado; fica o anterior.
        if: steps.download.outcome == 'success'
        run: python scripts/preprocess_data.py

      - name: Refresh metadata only (download falhou)
        # Os ETLs de domínio são comitados mesmo com o SIDRA fora; sem isto o
        # metadata.json ficaria com "atualizacao" e filtros.anoMaxDominios da
        # rodada anterior. Não lê os brutos do SIDRA e não toca mortalidade.json.
        if: steps.download.outcome == 'failure'
        # se falhar, não pode impedir o commit das saídas dos ETLs (o step
        # final já marca o job como falho por causa do download)
        continue-on-error: true
        run: python scripts/preprocess_data.py --somente-metadata

      - name: Check for changes
        id: changes
        # Só há diff quando o conteúdo dos dados muda: o download reescreve
        # arquivos apenas quando o sha256 difere e a "atualizacao" vem do
        # manifesto, não do relógio.
        run: |
          git add -A data/raw dashboard/public/data
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): atualiza dados de saúde $(date +%Y-%m)"
          git pull --rebase origin main
          git push

      - name: Trigger deploy workflow
        # Commits do GITHUB_TOKEN nao disparam workflows de push; sem este
        # dispatch o site do Pages nao recebe os dados novos.
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });

      - name: Falhar se alguma fonte caiu
        # Roda depois do commit e do dispatch: o que mudou já foi publicado.
        if: steps.download.outcome == 'failure' || steps.etl.outcome == 'failure'
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          ETL: ${{ steps.etl.outcome }}
        run: |
          if [ "$DOWNLOAD" = "failure" ]; then
            echo "::error::Download data (SIDRA/IBGE) falhou; os dados brutos desse step não foram atualizados. Veja o log do step."
          fi
          if [ "$ETL" = "failure" ]; then
            echo "::error::run_etl.py terminou com erro (domínio sem saída). Veja o log do step Run domain ETLs."
          fi
          exit 1
