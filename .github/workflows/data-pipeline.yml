name: Data Pipeline - Saúde Paraná

on:
  schedule:
    - cron: '0 6 1 * *'  # Dia 1 de cada mês, 6h UTC
  workflow_dispatch:

# contents: commit dos dados. actions: disparar o deploy.yml via API; sem
# "actions: write" o createWorkflowDispatch falha com "Resource not
# accessible by integration" (foi o que quebrou os runs de 08 e 09/2026).
permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    # O SIDRA às vezes demora minutos por consulta; 30 min já estourou (07/2026).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Download data
        run: python scripts/download_data.py

      - name: Preprocess data
        run: python scripts/preprocess_data.py

      - name: Check for changes
        id: changes
        # Só há diff quando o conteúdo dos dados muda: o download reescreve
        # arquivos apenas quando o sha256 difere e a "atualizacao" vem do
        # manifesto, não do relógio.
        run: |
          git add -A data/raw dashboard/public/data
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): atualiza dados de saúde $(date +%Y-%m)"
          git push

      - name: Trigger deploy workflow
        # Commits do GITHUB_TOKEN nao disparam workflows de push; sem este
        # dispatch o site do Pages nao recebe os dados novos.
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
